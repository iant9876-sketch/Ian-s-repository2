<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3fb2ff">
<title>The Long Way to Toucan Falls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#8fdcff;font-family:'Baloo 2',system-ui,-apple-system,sans-serif;color:#17324d;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;z-index:2}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer}

/* ---------- Floating bubble look ---------- */
.bub{border:2px solid rgba(255,255,255,.95);border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.98),rgba(255,255,255,.72) 55%,rgba(205,240,255,.6));box-shadow:0 8px 16px rgba(0,60,100,.22),inset 0 -5px 10px rgba(0,120,180,.16);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);color:#17324d;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;position:relative}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.2) translateY(20px);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* ---------- Menu (bubbles) ---------- */
#menu{position:fixed;inset:0;z-index:10;pointer-events:none}
#menu>*{pointer-events:auto}
#logo{position:absolute;top:calc(12px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));pointer-events:auto;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-weight:800;line-height:.95;font-size:20px;color:#0f6e8c;text-shadow:0 0 6px #fff,0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff}
#logo span{display:block;font-size:36px;color:#ff7a2e;text-shadow:0 3px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 -3px 0 #fff,0 5px 8px rgba(0,60,100,.3)}
#logo small{display:block;font-size:14px;color:#2b7f99;margin-top:4px;text-shadow:0 0 4px #fff,0 0 8px #fff}
#rotTip{position:absolute;top:calc(146px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));background:rgba(255,255,255,.85);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700;color:#e0572b;pointer-events:none;display:none}
.tag{position:fixed;left:0;top:0;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border:2px solid #fff;border-radius:999px;padding:2px 10px 2px 12px;box-shadow:0 6px 12px rgba(0,60,100,.2);will-change:transform}
.tag::after{content:'';position:absolute;left:var(--tail,50%);bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:rgba(255,255,255,.92);border-bottom:0}
.tag input{width:7.2em;border:none;background:transparent;font:800 17px 'Baloo 2',sans-serif;color:#17324d;text-align:center;outline:none;padding:0;user-select:text;-webkit-user-select:text}
.tag input:focus{color:#e0572b}
.tag b{font-size:13px;opacity:.75}
.tag.t input{width:6em;font-size:15px}
#cats{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));display:flex;gap:12px}
.cat{width:66px;height:66px;font-weight:800;font-size:12px;animation:bob 3.2s ease-in-out infinite}
.cat:nth-child(2){animation-delay:-.8s}.cat:nth-child(3){animation-delay:-1.6s}.cat:nth-child(4){animation-delay:-2.4s}
.cat span{font-size:25px;margin-bottom:2px}
.cat.open{border-color:#ff7a2e;box-shadow:0 0 0 3px #ff7a2e,0 8px 16px rgba(0,60,100,.22)}
#opts{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(200px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;width:max-content;max-width:96vw}
.opt{width:58px;height:58px;animation:pop .35s ease-out both}
.opt i{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;box-shadow:inset 0 -4px 6px rgba(0,0,0,.18),inset 0 3px 4px rgba(255,255,255,.5)}
.opt small{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:800;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,40,70,.7),0 0 6px rgba(0,40,70,.4)}
.opt.sel{border-color:#ff7a2e;box-shadow:0 0 0 4px #ff7a2e,0 8px 16px rgba(0,60,100,.22)}
#btnStart{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));border:3px solid #fff;border-radius:999px;padding:6px 40px 4px;font-weight:800;font-size:26px;color:#fff;background:linear-gradient(#ffa24a,#ff6a2e);box-shadow:0 6px 0 #c4481d,0 12px 20px rgba(0,60,100,.25);animation:bob 2.6s ease-in-out infinite;white-space:nowrap}
@keyframes bobc{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
#btnStart{animation-name:bobc}
@media (orientation:landscape){
  #logo{font-size:16px}#logo span{font-size:28px}
  #cats{left:calc(16px + env(safe-area-inset-left));transform:none;bottom:calc(14px + env(safe-area-inset-bottom));gap:10px}
  .cat{width:58px;height:58px}.cat span{font-size:22px}
  #opts{left:calc(16px + env(safe-area-inset-left));transform:none;bottom:calc(100px + env(safe-area-inset-bottom));justify-content:flex-start}
  .opt{width:52px;height:52px}.opt i{width:36px;height:36px;font-size:21px}
  #btnStart{left:auto;right:calc(20px + env(safe-area-inset-right));transform:none;bottom:calc(20px + env(safe-area-inset-bottom));animation-name:bob}
  #rotTip{display:none!important}
}
@media (orientation:portrait){#rotTip.touch{display:block}#cutBox{width:calc(100vw - 24px)}}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none}
#topbar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:rgba(255,255,255,.88);border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,70,110,.18);display:flex;align-items:center;gap:7px;white-space:nowrap}
#ebar{width:108px;height:12px;border-radius:8px;background:#d3edf5;overflow:hidden}
#efill{height:100%;width:100%;background:linear-gradient(90deg,#64cf3f,#c8f25a);border-radius:8px}
#efill.low{background:linear-gradient(90deg,#ff6d4a,#ffc04d)}
#right{display:flex;gap:8px;align-items:center}
#prog{position:relative;flex:1;max-width:260px;height:12px;margin:13px 26px 0;border-radius:8px;background:rgba(255,255,255,.75);box-shadow:0 3px 0 rgba(0,70,110,.18)}
#pfill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,#ffb03b,#ff7a2e);width:0}
#pmark{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:20px;left:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
#pgoal{position:absolute;right:-24px;top:50%;transform:translateY(-55%);font-size:18px}
#btnPause{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.88);font-weight:800;font-size:16px;color:#17324d;box-shadow:0 3px 0 rgba(0,70,110,.18)}
#btns{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
.rb{border-radius:50%;border:4px solid rgba(255,255,255,.85);font-weight:800;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none;padding:0}
.rb span{font-size:24px;margin-bottom:2px}
#btnHide{width:90px;height:90px;background:#22a9c2;font-size:14px}
#btnHide.on{background:#2f9a4d;border-color:#c6ff9e}
#hiddenTag{position:absolute;right:calc(18px + env(safe-area-inset-right));bottom:calc(118px + env(safe-area-inset-bottom));background:#2f9a4d;color:#fff;font-weight:800;padding:2px 12px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s}
#joyGhost{position:absolute;left:calc(34px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.35);text-align:center;transition:opacity .4s}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7);display:none;z-index:3;pointer-events:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.15)}
#warn{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;box-shadow:inset 0 0 60px 22px #fff,inset 0 0 150px 60px rgba(255,255,255,.6)}
#bubble{position:fixed;top:calc(56px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));transform:translate(-10px,0);max-width:min(330px,42vw);background:rgba(255,255,255,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:16px;padding:5px 12px 5px 6px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 rgba(0,70,110,.12);z-index:6;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;font-size:13.5px;line-height:1.25}
#bubble.show{opacity:1;transform:translate(0,0);pointer-events:auto}
#bubble .av{width:32px;height:32px}
@media (orientation:portrait){#bubble{max-width:72vw}}
#bubble b{color:#e0572b}
.av{width:40px;height:40px;border-radius:50%;flex:none;background:#1e1b30;position:relative;overflow:hidden}
.av i{position:absolute;left:20px;top:15px;width:26px;height:13px;border-radius:0 10px 12px 0}
.av u{position:absolute;left:9px;top:10px;width:9px;height:9px;border-radius:50%;background:#4cc3ff;border:2px solid #4cc3ff;box-shadow:inset 0 0 0 2px #111}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(23,50,77,.82);color:#fff;font-weight:700;padding:4px 14px;border-radius:999px;z-index:6;opacity:0;transition:opacity .3s;pointer-events:none;font-size:14px;white-space:nowrap}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,40,70,.16))}

/* ---------- Level chips, push button, boss bar ---------- */
#lvls{position:absolute;top:calc(104px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left));display:flex;gap:8px}
#lvls button{border:2px solid #fff;border-radius:999px;background:rgba(255,255,255,.85);font-weight:800;font-size:14px;padding:2px 12px;color:#17324d;box-shadow:0 3px 0 rgba(0,70,110,.18)}
#lvls button.sel{background:#ff7a2e;color:#fff}
#lvls button:disabled{opacity:.6}
#btnTrot{width:78px;height:78px;background:#e0862b;font-size:14px;margin-bottom:6px;position:relative;overflow:hidden}
#btnTrot.on{background:#ff9f3a;border-color:#fff3a0}
#btnTrot.cd{background:#9a7a5a}
#btnTrot.hide{display:none}
#trotCd{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(255,255,255,.35);pointer-events:none}
#btnPush{width:86px;height:86px;background:#4a4a5e;font-size:14px;margin-bottom:6px}
#bossBar{position:absolute;top:calc(56px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(45,22,32,.82);color:#fff;border-radius:999px;padding:3px 16px;font-weight:800;font-size:15px;display:flex;gap:8px;align-items:center;white-space:nowrap}
#bossPips i{display:inline-block;width:15px;height:15px;border-radius:50%;background:#ff4d5a;margin-left:4px;box-shadow:0 0 6px #ff4d5a}
#bossPips i.off{background:#5a5a5a;box-shadow:none}
.av.pa{background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
/* ---------- Cutscene ---------- */
#fade{position:fixed;inset:0;background:#fff;z-index:30;opacity:0;pointer-events:none;transition:opacity .6s}
#cutTap{position:fixed;inset:0;z-index:20}
#cutBox{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));width:min(450px,58vw);background:rgba(255,255,255,.64);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border-radius:20px;padding:10px 34px 12px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 rgba(0,70,110,.14);z-index:21;font-size:15.5px;line-height:1.28;pointer-events:none;opacity:0;transition:opacity .25s}
#cutBox.show{opacity:1}
#cutBox b{display:block;color:#e0572b;font-size:15px}
#cutMore{position:absolute;right:14px;bottom:8px;font-size:16px;color:#ff7a2e;animation:bob 1s ease-in-out infinite}
#cutSkip{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:22;border:none;border-radius:999px;background:rgba(255,255,255,.85);padding:4px 14px;font-weight:800;font-size:14px;color:#17324d}
#stir{position:fixed;inset:0;z-index:23;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;background:radial-gradient(circle at 50% 46%,rgba(30,15,5,.15) 0 28%,rgba(30,15,5,.6) 72%)}
#stirWrap{width:min(320px,64vmin);height:min(320px,64vmin);position:relative}
#stirRing{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ff9a3c var(--p,0%),rgba(255,255,255,.35) 0);-webkit-mask:radial-gradient(circle,transparent 0 62%,#000 63%);mask:radial-gradient(circle,transparent 0 62%,#000 63%)}
#stirSaucer{position:absolute;inset:5%;border-radius:50%;background:radial-gradient(circle,#ffffff 0 58%,#f3eadf 59% 63%,#ffffff 64% 92%,#e8dccf 100%);box-shadow:0 10px 24px rgba(0,0,0,.35)}
#stirHandle{position:absolute;left:73%;top:44%;width:17%;height:12%;border-radius:0 40px 40px 0;border:7px solid #ff9ab8;border-left:none;box-sizing:border-box}
#stirCupR{position:absolute;inset:21%;border-radius:50%;background:#ffb3c6;box-shadow:inset 0 0 0 4px #ff8fb0,0 4px 8px rgba(0,0,0,.25);overflow:hidden}
#stirTea{position:absolute;inset:9%;border-radius:50%;background:radial-gradient(circle at 40% 36%,#a8692e,#6b3d18);overflow:hidden;box-shadow:inset 0 3px 8px rgba(0,0,0,.45)}
#stirSwirl{position:absolute;inset:-10%;border-radius:50%;background:conic-gradient(rgba(255,236,205,.92) 0 7%,transparent 15% 25%,rgba(255,236,205,.8) 30% 35%,transparent 43% 58%,rgba(255,236,205,.85) 62% 68%,transparent 76% 88%,rgba(255,236,205,.7) 92%);-webkit-mask:radial-gradient(circle,transparent 0 8%,#000 26%,#000 62%,transparent 74%);mask:radial-gradient(circle,transparent 0 8%,#000 26%,#000 62%,transparent 74%);filter:blur(3px)}
#stirShine{position:absolute;left:22%;top:16%;width:26%;height:12%;border-radius:50%;background:rgba(255,255,255,.28);transform:rotate(-25deg)}
#stirGuide{position:absolute;inset:-4%;border-radius:50%;border:4px dashed rgba(255,255,255,.75);animation:spinG 2.6s linear infinite;pointer-events:none}
#stirGuide::after{content:'➜';position:absolute;left:50%;top:-17px;margin-left:-10px;font-size:22px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4)}
@keyframes spinG{to{transform:rotate(360deg)}}
#spoon{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;font-size:50px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:24;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
#stirTxt{margin-top:14px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 18px;font-weight:800;font-size:19px;color:#e0572b;box-shadow:0 4px 0 rgba(0,70,110,.18)}
#card{position:fixed;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;background:rgba(10,40,60,.35);overflow:hidden}
#card .rays{position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(255,230,120,.4) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
#card .cd{position:relative;background:#fff;border-radius:24px;padding:14px 22px 18px;text-align:center;width:min(340px,86vw);box-shadow:0 10px 0 rgba(0,70,110,.25);animation:pop .45s ease-out both}
#cardEm{font-size:70px;line-height:1.15;animation:bob 1.6s ease-in-out infinite}
#cardTag{display:inline-block;background:#ff7a2e;color:#fff;border-radius:999px;padding:1px 12px;font-weight:800;font-size:13px;letter-spacing:.06em}
#cardTitle{margin:6px 0 2px;font-size:26px;color:#0f6e8c;line-height:1.1}
#cardText{margin:2px 0 4px;color:#4a7385;font-weight:700;font-size:15px}
#journal .fr{display:flex;gap:12px;align-items:center;background:#eef8fb;border-radius:14px;padding:6px 10px;margin:8px 0;text-align:left;font-size:14px;font-weight:700;color:#3d6678}
#journal .fr b{display:block;font-size:18px;color:#0f6e8c}
#journal .fr .e{font-size:40px;width:48px;text-align:center;flex:none}
#journal .fr .av{width:46px;height:46px;flex:none}
#journal .fr.lock{opacity:.5}
/* ---------- Overlay screens ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:10px calc(10px + env(safe-area-inset-right)) 10px calc(10px + env(safe-area-inset-left))}
.panel{background:rgba(255,255,255,.95);border-radius:22px;padding:14px 18px 16px;max-height:calc(100% - 4px);overflow:auto;width:min(390px,92vw);box-shadow:0 8px 0 rgba(0,70,110,.22)}
.panel h2{margin:0 0 8px;font-size:24px;color:#0f6e8c}
.panel p{margin:0 0 10px;color:#4a7385;font-weight:700}
.big{display:block;width:100%;margin-top:10px;border:none;border-radius:16px;padding:9px;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(#ff9a3c,#ff6a2e);box-shadow:0 5px 0 #c4481d}
.big.alt{background:linear-gradient(#5fd3e6,#22a9c2);box-shadow:0 5px 0 #13788b;font-size:17px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch"></div>
<div id="menu">
  <div id="logo">The Long Way to<br><span>Toucan Falls</span><small>a sloth adventure</small></div>
  <div id="rotTip" class="touch">Rotate for best view</div>
  <label class="tag" id="tagS" style="--tail:72%"><input id="inName" maxlength="12" autocomplete="off" aria-label="Sloth name"><b>✏️</b></label>
  <div id="cats"></div>
  <div id="opts"></div>
  <button id="btnStart">Start</button>
</div>
<div id="hud" class="hide">
  <div id="topbar">
    <div class="pill"><span id="energyLabel">Energy</span><div id="ebar"><div id="efill"></div></div></div>
    <div id="prog"><div id="pfill"></div><div id="pmark">🦥</div><div id="pgoal">🦜</div></div>
    <div id="right"><button id="btnPause">II</button></div>
  </div>
  <div id="lvls"></div>
  <div id="btns">
    <button id="btnTrot" class="rb"><span>🐾</span>TROT</button>
    <button id="btnHide" class="rb"><span>🌴</span>HIDE</button>
  </div>
  <div id="hiddenTag">Hidden</div>
  <div id="joyGhost">MOVE</div>
  <div id="joy"><div id="knob"></div></div>
</div>
<div id="warn"></div>
<div id="bubble"><div class="av"><i></i><u></u></div><div id="bubbleTxt"></div></div>
<div id="toast"></div>
<div id="vig"></div>
<div id="fade"></div>
<div id="cutTap" class="hide"></div>
<div id="cutBox" class="hide"><div class="av"><i></i><u></u></div><div><b id="cutWho"></b><span id="cutTxt"></span></div><div id="cutMore">▼</div></div>
<button id="cutSkip" class="hide">Skip</button>
<div id="stir" class="hide"><div id="stirWrap"><div id="stirRing"></div><div id="stirSaucer"></div><div id="stirHandle"></div><div id="stirCupR"><div id="stirTea"><div id="stirSwirl"></div><div id="stirShine"></div></div></div><div id="stirGuide"></div></div><div id="stirTxt">Stir the tea!</div></div>
<div id="spoon">🥄</div>
<div id="card" class="hide"><div class="rays"></div><div class="cd"><div id="cardEm">🎉</div><div id="cardTag">FRIEND</div><div id="cardTitle">You did it!</div><div id="cardText">Zuzu is so happy you made it.</div><button id="cardBtn" class="big">Continue</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Enhanced graphics version - lighting, fog, sloth fur and face improvements applied */
